name: Stress Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Stress smoke
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: scripts/install

      - name: Run stress tests
        env:
          PYTHONASYNCIODEBUG: "1"
          PYTHONFAULTHANDLER: "1"
          PYTHONMALLOC: debug
          UVICORN_STRESS_CLIENTS: "50"
          UVICORN_STRESS_REQUESTS: "50"
          UVICORN_STRESS_SEEDS: "42"
        run: uv run pytest tests/test_stress.py -m stress -n 0

  nightly:
    name: Stress seed sweep (${{ matrix.shard }}/4)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: scripts/install

      - name: Run stress seed sweep
        env:
          PYTHONASYNCIODEBUG: "1"
          PYTHONFAULTHANDLER: "1"
          PYTHONMALLOC: debug
          SHARD: ${{ matrix.shard }}
          UVICORN_STRESS_CLIENTS: "20"
          UVICORN_STRESS_REQUESTS: "50"
        run: |
          seeds=$(seq "$SHARD" 4 100 | paste -sd, -)
          UVICORN_STRESS_SEEDS="$seeds" uv run pytest tests/test_stress.py -m stress -n 0
